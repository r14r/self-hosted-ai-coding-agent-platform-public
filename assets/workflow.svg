<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330" role="img"><rect width="1000" height="1330" fill="#f8fafc"/><text x="500" y="44" text-anchor="middle" font-size="29" font-family="Arial" font-weight="bold">Workflow · Neun Phasen</text><rect x="170" y="75" width="660" height="104" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="500" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">1 · Repository Discovery</text><text x="500" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Sprache, Build-System, Dependencies</text><path d="M500 179 V195 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="205" width="660" height="104" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="500" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">2 · Maintenance Detection</text><text x="500" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Updates, CVEs, Codequalität, TODOs</text><path d="M500 309 V325 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="335" width="660" height="104" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="500" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">3 · Planning</text><text x="500" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Plan, Scope, Risiko, Policy-Prüfung</text><path d="M500 439 V455 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="465" width="660" height="104" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="500" y="496" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">4 · Branch &amp; Sandbox</text><text x="500" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Isolierter Checkout, Baseline-Tests</text><path d="M500 569 V585 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="595" width="660" height="104" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2.5"/><text x="500" y="626" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">5 · Coding Agent</text><text x="500" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Codeänderungen und Tool-Aufrufe</text><path d="M500 699 V715 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="725" width="660" height="104" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/><text x="500" y="756" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">6 · Independent Validation</text><text x="500" y="786" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Build, Test, SAST, SCA, Secret Scan</text><path d="M500 829 V845 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="855" width="660" height="104" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="500" y="886" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">7 · Review Gate</text><text x="500" y="916" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Diff, Befunde, Reproduzierbarkeit</text><path d="M500 959 V975 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="985" width="660" height="104" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="500" y="1016" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">8 · Pull Request</text><text x="500" y="1046" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Änderungen, Reports, Nachweise</text><path d="M500 1089 V1105 m-8 -4 l8 9 8 -9" fill="none" stroke="#64748b" stroke-width="3"/><rect x="170" y="1115" width="660" height="104" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/><text x="500" y="1146" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111827">9 · Human Approval</text><text x="500" y="1176" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1f2937">Review, Freigabe oder Ablehnung</text><path d="M170 1028 H70 V465 H170" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="11 10"/><text transform="translate(52 750) rotate(-90)" font-family="Arial" font-size="22" fill="#dc2626">Rework (begrenzt)</text><text x="500" y="1290" text-anchor="middle" font-size="20" font-family="Arial">Zielzustand: Reviewed · Mergeable — kein Auto-Merge</text></svg>