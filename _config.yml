title: Self-Hosted AI Coding Agent Platform
description: Documentation for the self-hosted AI coding agent platform
url: "https://r14r.github.io"
baseurl: "/self-hosted-ai-coding-agent-platform-public"
locale: en
markdown: kramdown
highlighter: rouge
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: default
search: true
plugins:
  - jekyll-include-cache
defaults:
  - scope:
      path: ""
    values:
      layout: single
      toc: true
      toc_label: "On this page"
      toc_sticky: true
      sidebar:
        nav: docs
exclude:
  - Gemfile
  - Gemfile.lock
  - justfile
  - README.md
  - vendor
  - .bundle
